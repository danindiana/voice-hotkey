<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <filter id="glow-green">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-cyan">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-purple">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#080818"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="url(#bg-grad)" rx="12"/>
  <rect width="900" height="220" fill="none" stroke="#bc13fe" stroke-width="1.5" rx="12" opacity="0.4"/>

  <!-- Microphone body -->
  <rect x="52" y="38" width="48" height="90" rx="24"
        fill="none" stroke="#39ff14" stroke-width="3.5"
        filter="url(#glow-green)"/>
  <!-- Mic grill lines -->
  <line x1="62" y1="65" x2="90" y2="65" stroke="#39ff14" stroke-width="1.5" opacity="0.5"/>
  <line x1="62" y1="75" x2="90" y2="75" stroke="#39ff14" stroke-width="1.5" opacity="0.5"/>
  <line x1="62" y1="85" x2="90" y2="85" stroke="#39ff14" stroke-width="1.5" opacity="0.5"/>
  <line x1="62" y1="95" x2="90" y2="95" stroke="#39ff14" stroke-width="1.5" opacity="0.5"/>

  <!-- Mic stand arc -->
  <path d="M 30 128 Q 76 170 122 128"
        fill="none" stroke="#39ff14" stroke-width="3"
        filter="url(#glow-green)"/>
  <!-- Mic stem -->
  <line x1="76" y1="165" x2="76" y2="190"
        stroke="#39ff14" stroke-width="3" filter="url(#glow-green)"/>
  <line x1="52" y1="190" x2="100" y2="190"
        stroke="#39ff14" stroke-width="3" filter="url(#glow-green)"/>

  <!-- Sound waves (right of mic) -->
  <path d="M 136 68 Q 158 83 136 98"
        fill="none" stroke="#0ff0fc" stroke-width="2.5"
        filter="url(#glow-cyan)" opacity="0.9"/>
  <path d="M 148 54 Q 182 83 148 112"
        fill="none" stroke="#0ff0fc" stroke-width="2"
        filter="url(#glow-cyan)" opacity="0.7"/>
  <path d="M 160 40 Q 206 83 160 126"
        fill="none" stroke="#0ff0fc" stroke-width="1.5"
        filter="url(#glow-cyan)" opacity="0.45"/>

  <!-- Main title -->
  <text x="235" y="100"
        font-family="'Courier New', Courier, monospace"
        font-size="58" font-weight="bold"
        fill="#39ff14" filter="url(#glow-green)">voice-hotkey</text>

  <!-- Subtitle -->
  <text x="237" y="142"
        font-family="'Courier New', Courier, monospace"
        font-size="22"
        fill="#0ff0fc" filter="url(#glow-cyan)">Push-to-Talk for Claude Code</text>

  <!-- Hotkey badge -->
  <rect x="237" y="160" width="162" height="34" rx="6"
        fill="#110022" stroke="#bc13fe" stroke-width="2"
        filter="url(#glow-purple)"/>
  <text x="318" y="183" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="15" font-weight="bold"
        fill="#bc13fe" filter="url(#glow-purple)">Ctrl+Alt+V</text>

  <!-- Waveform bars (decorative, far right) -->
  <g transform="translate(720,110)" filter="url(#glow-green)" opacity="0.7">
    <rect x="0"   y="-40" width="10" height="80"  fill="#39ff14" opacity="0.9" rx="3"/>
    <rect x="18"  y="-28" width="10" height="56"  fill="#39ff14" opacity="0.7" rx="3"/>
    <rect x="36"  y="-55" width="10" height="110" fill="#39ff14" opacity="0.95" rx="3"/>
    <rect x="54"  y="-20" width="10" height="40"  fill="#39ff14" opacity="0.6" rx="3"/>
    <rect x="72"  y="-48" width="10" height="96"  fill="#39ff14" opacity="0.85" rx="3"/>
    <rect x="90"  y="-32" width="10" height="64"  fill="#39ff14" opacity="0.75" rx="3"/>
    <rect x="108" y="-15" width="10" height="30"  fill="#39ff14" opacity="0.5" rx="3"/>
    <rect x="126" y="-60" width="10" height="120" fill="#39ff14" opacity="1.0" rx="3"/>
    <rect x="144" y="-35" width="10" height="70"  fill="#39ff14" opacity="0.8" rx="3"/>
  </g>

  <!-- Corner accent dots -->
  <circle cx="20" cy="20" r="4" fill="#bc13fe" opacity="0.6"/>
  <circle cx="880" cy="20" r="4" fill="#bc13fe" opacity="0.6"/>
  <circle cx="20" cy="200" r="4" fill="#bc13fe" opacity="0.6"/>
  <circle cx="880" cy="200" r="4" fill="#bc13fe" opacity="0.6"/>
</svg>
